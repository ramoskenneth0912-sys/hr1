openapi: 3.0.3
info:
  title: TRI-M GLOBAL HR1 API
  version: 1.0.0
  description: >
    REST API for the Merchandising Management System (HR1). JSON only.
    Bearer tokens (7-day) or existing website session cookie.
servers:
  - url: http://localhost/HR1/api/v1
tags:
  - name: Auth
  - name: Jobs
  - name: Applications
  - name: Users
  - name: Admin
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an applicant account (role applicant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, example: juan }
                email: { type: string, format: email }
                password: { type: string, format: password, example: Passw0rd1 }
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
      responses:
        '201': { description: Registered (returns user + token) }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, password]
              properties:
                credential: { type: string, example: juan@example.com }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200': { description: Login successful (user + token) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the presented Bearer token
      responses:
        '200': { description: '{ data: { revoked: true } }' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs:
    get:
      tags: [Jobs]
      security: []
      summary: List jobs (public sees open only; admins may pass admin_view=1)
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: location, schema: { type: string } }
        - { in: query, name: category, schema: { type: string, description: department name } }
        - { in: query, name: department_id, schema: { type: integer } }
        - { in: query, name: employment_type, schema: { type: string, example: full-time } }
        - { in: query, name: status, schema: { type: string, enum: [draft, open, closed, filled] }, description: admin only }
        - { in: query, name: admin_view, schema: { type: integer, enum: [0, 1] }, description: admin only }
      responses:
        '200': { description: Paginated job list }
    post:
      tags: [Jobs]
      summary: Create a job (hr/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                department_id: { type: integer }
                description: { type: string }
                requirements: { type: string }
                qualifications: { type: string }
                required_skills: { type: string }
                education_requirement: { type: string }
                experience_requirement: { type: string }
                work_location: { type: string }
                employment_type:
                  type: string
                  enum: [regular, full-time, contractual, contract, probationary, part_time, part-time, internship, intern]
                vacancies: { type: integer, minimum: 0 }
                status: { type: string, enum: [draft, open, closed, filled] }
                posted_date: { type: string, format: date }
                closing_date: { type: string, format: date }
      responses:
        '201': { description: Job created (job_code auto-generated) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /jobs/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Jobs]
      security: []
      summary: Job detail (non-open jobs hidden from public)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Jobs]
      summary: Full update (hr/manager; requires title)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/JobWrite' } } } }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    patch:
      tags: [Jobs]
      summary: Partial update (hr/manager)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/JobWrite' } } } }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Jobs]
      summary: Delete job (hr/manager)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications:
    get:
      tags: [Applications]
      summary: List applications (own for applicants; all for hr/manager)
      parameters:
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: email, schema: { type: string }, description: admin only }
        - { in: query, name: status, schema: { type: string, example: pending }, description: aliases accepted; admin only }
        - { in: query, name: job_id, schema: { type: integer }, description: admin only }
        - { in: query, name: search, schema: { type: string }, description: admin only }
      responses:
        '200': { description: Paginated applications }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Applications]
      security: []
      summary: Submit an application (multipart with resume)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [job_id, first_name, last_name, email, resume]
              properties:
                job_id: { type: integer }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                address: { type: string }
                education: { type: string }
                skills: { type: string }
                work_experience: { type: string }
                cover_letter: { type: string }
                resume:
                  type: string
                  format: binary
                  description: PDF/DOC/DOCX up to 5 MB
      responses:
        '201': { description: Application submitted }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /applications/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Applications]
      summary: Application detail (owner or admin; others get 404)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Applications]
      summary: Update own application (full)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationWrite' } } } }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Applications]
      summary: Update own application (partial)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationWrite' } } } }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Applications]
      summary: Delete application (hr/manager)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/applications/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Admin]
      summary: Get application status (hr/manager)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      summary: Change application status (hr/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, new, reviewing, screening, shortlisted, interview, accepted, offered, hired, rejected]
                notes: { type: string }
      responses:
        '200': { description: Status updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    patch:
      $ref: '#/paths/~1admin~1applications~1{id}~1status/put'

  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard counters (hr/manager)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      tags: [Users]
      summary: List users (hr/manager)
      parameters:
        - { in: query, name: role, schema: { type: string, enum: [hr, manager, employee, applicant] } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: Paginated users }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Users]
      summary: User detail (self or hr/manager)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update profile / change password (self or hr/manager)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                current_password: { type: string, format: password, description: required for self password change }
                password: { type: string, format: password }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    patch:
      $ref: '#/paths/~1users~1{id}/put'
    delete:
      tags: [Users]
      summary: Deactivate user + revoke tokens (hr/manager)
      responses:
        '204': { description: Deactivated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    JobWrite:
      type: object
      properties:
        title: { type: string }
        department_id: { type: integer }
        description: { type: string }
        requirements: { type: string }
        qualifications: { type: string }
        required_skills: { type: string }
        education_requirement: { type: string }
        experience_requirement: { type: string }
        work_location: { type: string }
        employment_type: { type: string }
        vacancies: { type: integer, minimum: 0 }
        status: { type: string, enum: [draft, open, closed, filled] }
        posted_date: { type: string, format: date }
        closing_date: { type: string, format: date }
    ApplicationWrite:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        address: { type: string }
        education: { type: string }
        skills: { type: string }
        work_experience: { type: string }
        cover_letter: { type: string }
  responses:
    Unauthorized:
      description: Missing/invalid credentials
      content: { application/json: { example: { success: false, message: Authentication required., errors: {} } } }
    Forbidden:
      description: Insufficient role
      content: { application/json: { example: { success: false, message: Access denied., errors: {} } } }
    NotFound:
      description: Resource not found or hidden
      content: { application/json: { example: { success: false, message: Resource not found., errors: {} } } }
    Conflict:
      description: Duplicate/conflicting state
      content: { application/json: { example: { success: false, message: Conflict., errors: {} } } }
    Validation:
      description: Validation failed
      content: { application/json: { example: { success: false, message: Validation failed., errors: { field: message } } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { example: { success: false, message: Too many requests., errors: {} } } }
